[build]
builder = "nixpacks"
buildCommand = "corepack enable pnpm && pnpm install --frozen-lockfile && pnpm --filter @workspace/toy-mall run build && pnpm --filter @workspace/api-server run build"

[deploy]
startCommand = "node artifacts/api-server/dist/index.mjs"
restartPolicyType = "on_failure"

[environments.production.variables]
NODE_ENV = "production"
