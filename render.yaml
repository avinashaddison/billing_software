services:
  - type: web
    name: toy-mall
    runtime: node
    region: singapore
    plan: free

    buildCommand: "corepack enable pnpm && pnpm install --frozen-lockfile && pnpm --filter @workspace/toy-mall run build && pnpm --filter @workspace/api-server run build"
    startCommand: "node artifacts/api-server/dist/index.mjs"

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: STORE_NAME
        sync: false
