openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Toy Mall Inventory Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Product operations
  - name: stock-logs
    description: Stock log operations
  - name: sales
    description: Sales operations
  - name: dashboard
    description: Dashboard summary operations
  - name: bills
    description: Billing and checkout operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by name or SKU
        - name: category
          in: query
          schema:
            type: string
          description: Filter by category
        - name: lowStock
          in: query
          schema:
            type: boolean
          description: Filter to low stock products only
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/sku/{sku}:
    get:
      operationId: getProductBySku
      tags: [products]
      summary: Get product by SKU
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductInput"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Product deleted
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{id}/stock:
    post:
      operationId: updateStock
      tags: [products]
      summary: Update product stock (IN, OUT, ADJUSTMENT)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockUpdateBody"
      responses:
        "200":
          description: Stock updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockUpdateResponse"
        "400":
          description: Validation error (e.g. insufficient stock)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{id}/stock-history:
    get:
      operationId: getProductStockHistory
      tags: [products, stock-logs]
      summary: Get FIFO stock-batch history for a product
      description: >
        Replays the product's complete stock ledger and shows, for every stock-in
        event, how many units were added, sold, adjusted away, and remain.
        Opening stock, returns, and upward adjustments remain unattributed rather
        than being assigned to a dated supplier restock.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product stock-batch history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductStockHistory"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{id}/qr:
    get:
      operationId: getProductQr
      tags: [products]
      summary: Get QR code data URL for a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: QR code data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QrCodeResponse"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stock-logs:
    get:
      operationId: listStockLogs
      tags: [stock-logs]
      summary: List stock logs
      parameters:
        - name: productId
          in: query
          schema:
            type: string
          description: Filter by product ID
        - name: type
          in: query
          schema:
            type: string
            enum: [IN, OUT, ADJUSTMENT, RETURN]
          description: Filter by log type
        - name: today
          in: query
          schema:
            type: boolean
          description: Only return logs created today (server time)
        - name: from
          in: query
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Start of the date range (inclusive), YYYY-MM-DD in IST
        - name: to
          in: query
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: End of the date range (inclusive), YYYY-MM-DD in IST
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
          description: Number of logs to return
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Offset for pagination
      responses:
        "200":
          description: List of stock logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockLog"

  /stock-logs/entry-summary:
    get:
      operationId: listStockEntrySummary
      tags: [stock-logs]
      summary: Per-product stock entry (stock-in) summary for a date range
      description: >
        Groups stock movements by product over an IST date range so the shop can
        see which products were entered, how much was entered in total, and when
        each product was last entered.
      parameters:
        - name: from
          in: query
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Start of the date range (inclusive), YYYY-MM-DD in IST
        - name: to
          in: query
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: End of the date range (inclusive), YYYY-MM-DD in IST
        - name: type
          in: query
          schema:
            type: string
            enum: [IN, OUT, ADJUSTMENT, RETURN]
            default: IN
          description: Movement type to summarise. Defaults to IN (stock entry).
        - name: search
          in: query
          schema:
            type: string
          description: Filter by product name or SKU
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
          description: Maximum number of product rows to return
      responses:
        "200":
          description: Per-product entry summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockEntrySummary"

  /sales:
    get:
      operationId: listSales
      tags: [sales]
      summary: List sales records
      parameters:
        - name: productId
          in: query
          schema:
            type: string
          description: Filter by product ID
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of sales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/low-stock:
    get:
      operationId: getLowStockProducts
      tags: [dashboard]
      summary: Get products with low stock
      responses:
        "200":
          description: Low stock products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /dashboard/today-activity:
    get:
      operationId: getTodayActivity
      tags: [dashboard]
      summary: Get today's IN/OUT activity counts
      responses:
        "200":
          description: Today's activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayActivity"

  /dashboard/categories:
    get:
      operationId: getCategoryBreakdown
      tags: [dashboard]
      summary: Get product count and stock value by category
      responses:
        "200":
          description: Category breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryStat"

  /dashboard/receivables:
    get:
      operationId: getReceivablesSummary
      tags: [dashboard]
      summary: Outstanding money owed to the shop, with top debtors
      responses:
        "200":
          description: Receivables summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceivablesSummary"

  /bills/checkout:
    post:
      operationId: checkout
      tags: [bills]
      summary: Create a new bill at checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "201":
          description: Bill created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bills:
    get:
      operationId: listBills
      tags: [bills]
      summary: List all bills
      responses:
        "200":
          description: List of bills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bill"

  /bills/{id}:
    get:
      operationId: getBill
      tags: [bills]
      summary: Get a single bill with its items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bill detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillDetail"
        "404":
          description: Bill not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bills/{id}/payment:
    post:
      operationId: recordBillPayment
      tags: [bills]
      summary: Record a payment against an outstanding (credit) bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordPaymentInput"
      responses:
        "200":
          description: Updated bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Bill not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        sku:
          type: string
        barcode:
          type: ["string", "null"]
        category:
          type: string
        price:
          type: number
        salePrice:
          type: ["number", "null"]
        purchasePrice:
          type: ["number", "null"]
        salePriceUntil:
          type: ["string", "null"]
          description: ISO datetime string after which the sale price is no longer valid
        stock:
          type: integer
        lowStockThreshold:
          type: integer
        supplierId:
          type: ["string", "null"]
          format: uuid
        createdAt:
          type: string
      required:
        - id
        - name
        - sku
        - category
        - price
        - stock
        - lowStockThreshold
        - supplierId
        - createdAt

    CreateProductInput:
      type: object
      properties:
        name:
          type: string
        sku:
          type: string
        barcode:
          type: ["string", "null"]
        category:
          type: string
        price:
          type: number
        salePrice:
          type: ["number", "null"]
        purchasePrice:
          type: ["number", "null"]
        salePriceUntil:
          type: ["string", "null"]
          description: ISO datetime string after which the sale price is no longer valid
        stock:
          type: integer
        lowStockThreshold:
          type: integer
        imageUrl:
          type: ["string", "null"]
        supplierId:
          type: ["string", "null"]
      required:
        - name
        - sku
        - category
        - price

    UpdateProductInput:
      type: object
      properties:
        name:
          type: string
        sku:
          type: string
        barcode:
          type: ["string", "null"]
        category:
          type: string
        price:
          type: number
        salePrice:
          type: ["number", "null"]
        purchasePrice:
          type: ["number", "null"]
        salePriceUntil:
          type: ["string", "null"]
          description: ISO datetime string after which the sale price is no longer valid
        stock:
          type: integer
        lowStockThreshold:
          type: integer
        imageUrl:
          type: ["string", "null"]
        supplierId:
          type: ["string", "null"]

    StockUpdateBody:
      type: object
      properties:
        type:
          type: string
          enum: [IN, OUT, ADJUSTMENT]
        quantity:
          type: integer
        userId:
          type: string
        purchasePrice:
          type: ["number", "null"]
          minimum: 0
          maximum: 100000000
          description: Purchase price per unit captured for this IN restock
        supplierId:
          type: ["string", "null"]
          format: uuid
          description: Supplier selected for this IN restock
        invoiceNumber:
          type: ["string", "null"]
          maxLength: 100
          description: Supplier invoice or reference number for this IN restock
        note:
          type: ["string", "null"]
          maxLength: 500
          description: Optional note for this IN restock
      required:
        - type
        - quantity

    StockUpdateResponse:
      type: object
      properties:
        product:
          $ref: "#/components/schemas/Product"
        log:
          $ref: "#/components/schemas/StockLog"
        sale:
          $ref: "#/components/schemas/Sale"
      required:
        - product
        - log

    QrCodeResponse:
      type: object
      properties:
        sku:
          type: string
        url:
          type: string
        qrDataUrl:
          type: string
      required:
        - sku
        - url
        - qrDataUrl

    StockLog:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        productName:
          type: string
        productSku:
          type: string
        type:
          type: string
          enum: [IN, OUT, ADJUSTMENT, RETURN]
        quantity:
          type: integer
        purchasePrice:
          type: ["number", "null"]
        supplierId:
          type: ["string", "null"]
          format: uuid
        supplierName:
          type: ["string", "null"]
        invoiceNumber:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        userId:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - productId
        - productName
        - productSku
        - type
        - quantity
        - purchasePrice
        - supplierId
        - supplierName
        - invoiceNumber
        - note
        - createdAt

    StockBatch:
      type: object
      properties:
        id:
          type: string
        addedQuantity:
          type: integer
        soldQuantity:
          type: integer
        adjustedQuantity:
          type: integer
          description: Units whose batch attribution was reset by an absolute stock correction, not counted as sales
        purchasePrice:
          type: ["number", "null"]
          description: Purchase price per unit recorded when this stock was added
        supplierId:
          type: ["string", "null"]
          format: uuid
        supplierName:
          type: ["string", "null"]
          description: Supplier name snapshot recorded when this stock was added
        invoiceNumber:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        remainingQuantity:
          type: integer
        addedAt:
          type: string
          description: ISO timestamp of the stock-in event
      required:
        - id
        - addedQuantity
        - soldQuantity
        - adjustedQuantity
        - purchasePrice
        - supplierId
        - supplierName
        - invoiceNumber
        - note
        - remainingQuantity
        - addedAt

    ProductStockHistory:
      type: object
      properties:
        productId:
          type: string
        currentStock:
          type: integer
        summary:
          type: object
          properties:
            stockedQuantity:
              type: integer
              description: Total units recorded by stock-in events
            soldQuantity:
              type: integer
              description: Total units recorded by stock-out events
            returnedQuantity:
              type: integer
              description: Total customer-return units put back into stock
            unattributedRemaining:
              type: integer
              description: Current opening, returned, or adjusted stock not tied to a dated restock
            batchCount:
              type: integer
          required:
            - stockedQuantity
            - soldQuantity
            - returnedQuantity
            - unattributedRemaining
            - batchCount
        batches:
          type: array
          items:
            $ref: "#/components/schemas/StockBatch"
      required:
        - productId
        - currentStock
        - summary
        - batches

    ProductEntrySummary:
      type: object
      properties:
        productId:
          type: string
        productName:
          type: string
        productSku:
          type: string
        totalQuantity:
          type: integer
          description: Total quantity moved for this product across the range
        entryCount:
          type: integer
          description: Number of separate movement events in the range
        firstEntryAt:
          type: string
          description: Timestamp of the earliest movement in the range
        lastEntryAt:
          type: string
          description: Timestamp of the most recent movement in the range
      required:
        - productId
        - productName
        - productSku
        - totalQuantity
        - entryCount
        - firstEntryAt
        - lastEntryAt

    StockEntrySummary:
      type: object
      description: >
        Per-product rollup plus range-wide totals. The totals are computed over
        the WHOLE matching range, not just the returned `products` page, so they
        stay accurate when the row list is capped by `limit`.
      properties:
        totals:
          type: object
          properties:
            productCount:
              type: integer
              description: Distinct products with at least one movement in the range
            totalQuantity:
              type: integer
              description: Total quantity moved across the whole range
            entryCount:
              type: integer
              description: Total number of movement events across the whole range
          required:
            - productCount
            - totalQuantity
            - entryCount
        products:
          type: array
          items:
            $ref: "#/components/schemas/ProductEntrySummary"
        truncated:
          type: boolean
          description: True when more products matched than `limit` returned
      required:
        - totals
        - products
        - truncated

    Sale:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        productName:
          type: string
        productSku:
          type: string
        quantity:
          type: integer
        totalPrice:
          type: number
        createdAt:
          type: string
      required:
        - id
        - productId
        - productName
        - productSku
        - quantity
        - totalPrice
        - createdAt

    DashboardSummary:
      type: object
      properties:
        totalProducts:
          type: integer
        totalStock:
          type: integer
        totalStockValue:
          type: number
        lowStockCount:
          type: integer
        todayInCount:
          type: integer
        todayOutCount:
          type: integer
      required:
        - totalProducts
        - totalStock
        - totalStockValue
        - lowStockCount
        - todayInCount
        - todayOutCount

    TodayActivity:
      type: object
      properties:
        inCount:
          type: integer
        outCount:
          type: integer
        inQuantity:
          type: integer
        outQuantity:
          type: integer
      required:
        - inCount
        - outCount
        - inQuantity
        - outQuantity

    CategoryStat:
      type: object
      properties:
        category:
          type: string
        productCount:
          type: integer
        totalStock:
          type: integer
        stockValue:
          type: number
      required:
        - category
        - productCount
        - totalStock
        - stockValue

    CheckoutItem:
      type: object
      description: >-
        One bill line. Either a catalogue line (`productId`, optional `mrp`)
        or a manual / non-inventory line (`name` instead of `productId`, no
        stock movement). Exactly one of `productId` or `name` must be present.
      properties:
        productId:
          type: string
          description: Catalogue product id. Omit on manual lines.
        name:
          type: string
          maxLength: 80
          description: Manual lines only — the description printed on the receipt.
        quantity:
          type: integer
        price:
          type: number
          description: Effective per-unit selling price.
        mrp:
          type: number
          description: Catalogue lines only.
        purchasePrice:
          type: number
          minimum: 0
          maximum: 99999999.99
          description: >-
            Per-unit cost typed by the cashier, stored on the sale line so
            profit reports net it against the price. REQUIRED on manual lines
            (no productId): checkout answers 400 naming the item when it is
            missing. 0 is a valid explicit value. Ignored on catalogue lines,
            whose cost is read from the product at checkout.
      required:
        - quantity
        - price

    CheckoutInput:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CheckoutItem"
        paymentMode:
          type: string
          enum: [cash, upi, credit]
          description: >-
            Mode of payment. `credit` records the bill as unpaid (receivable)
            against the customer identified by `customerPhone`.
        customerName:
          type: string
        customerPhone:
          type: string
          pattern: "^[0-9]{10}$"
          description: >-
            Customer's 10-digit mobile number (bare digits, no +91). REQUIRED
            on every bill — checkout answers 400 without it. It is the key the
            customer ledger, credit collection and repeat-customer lookups use.
        discount:
          type: number
          description: Raw discount value (e.g. 10 for 10% or 200 for ₹200)
        discountType:
          type: string
          enum: [percent, amount]
          description: How to interpret the discount value
      required:
        - items
        - paymentMode
        - customerPhone

    Bill:
      type: object
      properties:
        id:
          type: string
        billNumber:
          type: integer
        totalAmount:
          type: number
        amountPaid:
          type: number
          description: Cumulative amount collected against this bill.
        paymentStatus:
          type: string
          enum: [paid, partial, unpaid]
        itemsCount:
          type: integer
        paymentMode:
          type: string
        customerName:
          type: ["string", "null"]
        customerPhone:
          type: ["string", "null"]
        discount:
          type: ["number", "null"]
        discountType:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - totalAmount
        - amountPaid
        - paymentStatus
        - itemsCount
        - paymentMode
        - createdAt

    BillItem:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        productName:
          type: string
        productSku:
          type: string
        quantity:
          type: integer
        price:
          type: number
        mrp:
          type: ["number", "null"]
        subtotal:
          type: number
      required:
        - id
        - productId
        - productName
        - productSku
        - quantity
        - price
        - subtotal

    BillDetail:
      type: object
      properties:
        bill:
          $ref: "#/components/schemas/Bill"
        items:
          type: array
          items:
            $ref: "#/components/schemas/BillItem"
      required:
        - bill
        - items

    CheckoutResponse:
      type: object
      properties:
        bill:
          $ref: "#/components/schemas/Bill"
        items:
          type: array
          items:
            $ref: "#/components/schemas/BillItem"
      required:
        - bill
        - items

    RecordPaymentInput:
      type: object
      properties:
        amount:
          type: number
          description: Amount being collected now (clamped to outstanding balance)
        paymentMode:
          type: string
          enum: [cash, upi]
          description: How the customer paid this installment
      required:
        - amount

    Debtor:
      type: object
      properties:
        customerName:
          type: ["string", "null"]
        customerPhone:
          type: ["string", "null"]
        outstanding:
          type: number
        billCount:
          type: integer
        lastBillAt:
          type: string
      required:
        - outstanding
        - billCount
        - lastBillAt

    ReceivablesSummary:
      type: object
      properties:
        totalOutstanding:
          type: number
        billCount:
          type: integer
        topDebtors:
          type: array
          items:
            $ref: "#/components/schemas/Debtor"
      required:
        - totalOutstanding
        - billCount
        - topDebtors
