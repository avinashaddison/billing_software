kind = "web"
previewPath = "/"
title = "Toy Mall Inventory"
version = "1.0.0"
id = "artifacts/toy-mall"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20238

[services.development]
run = "pnpm --filter @workspace/toy-mall run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/toy-mall", "run", "build" ]
publicDir = "artifacts/toy-mall/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20238"
BASE_PATH = "/"
